<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <filter id="ds" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ProseMirror 数据流转与状态更新图</text>

  <!-- User interaction -->
  <rect x="60" y="80" width="180" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">用户交互 / 命令</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#64748b">键盘 · 鼠标 · API 调用</text>

  <!-- Transaction -->
  <rect x="340" y="70" width="240" height="100" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#ds)"/>
  <text x="460" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0e7490">Transaction</text>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#0e7490">(extends Transform)</text>
  <text x="460" y="142" text-anchor="middle" font-size="11" fill="#155e75">steps[] · selection · storedMarks</text>
  <text x="460" y="158" text-anchor="middle" font-size="11" fill="#155e75">meta · mapping</text>

  <!-- state.apply -->
  <rect x="680" y="80" width="220" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <text x="790" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">state.apply(tr)</text>
  <text x="790" y="132" text-anchor="middle" font-size="11" fill="#64748b">字段 apply · 生成新状态</text>

  <!-- Arrows row 1 -->
  <line x1="240" y1="115" x2="335" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="287" y="106" text-anchor="middle" font-size="10" fill="#64748b">创建</text>
  <line x1="580" y1="115" x2="675" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- EditorState -->
  <rect x="650" y="220" width="280" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#ds)"/>
  <text x="790" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">EditorState (不可变)</text>
  <line x1="680" y1="262" x2="900" y2="262" stroke="#86efac" stroke-width="1"/>
  <rect x="675" y="275" width="110" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="730" y="297" text-anchor="middle" font-size="12" fill="#166534" font-weight="500">doc: Node</text>
  <rect x="800" y="275" width="115" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="857" y="297" text-anchor="middle" font-size="12" fill="#166534" font-weight="500">selection</text>
  <rect x="675" y="320" width="110" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="730" y="342" text-anchor="middle" font-size="12" fill="#166534" font-weight="500">storedMarks</text>
  <rect x="800" y="320" width="115" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="857" y="342" text-anchor="middle" font-size="12" fill="#166534" font-weight="500">plugin fields</text>
  <text x="790" y="378" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">每次 apply 都产生全新实例，旧状态不被修改</text>

  <!-- arrow from apply to state -->
  <path d="M 790 150 L 790 215" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/>
  <text x="803" y="186" font-size="10" fill="#059669">生成</text>

  <!-- View -->
  <rect x="60" y="240" width="240" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#ds)"/>
  <text x="180" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">EditorView</text>
  <line x1="85" y1="284" x2="275" y2="284" stroke="#c7d2fe" stroke-width="1"/>
  <text x="180" y="308" text-anchor="middle" font-size="12" fill="#4338ca">DOM 差异化更新</text>
  <text x="180" y="330" text-anchor="middle" font-size="12" fill="#4338ca">Decoration 渲染</text>
  <text x="180" y="352" text-anchor="middle" font-size="12" fill="#4338ca">NodeView · 事件监听</text>

  <!-- state to view -->
  <path d="M 650 305 L 305 305" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="477" y="295" text-anchor="middle" font-size="11" fill="#475569" font-weight="500">view.updateState(newState)</text>

  <!-- view to user interaction (loop) -->
  <path d="M 150 240 L 150 155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>
  <text x="160" y="200" font-size="10" fill="#64748b">DOM 事件反馈</text>

  <!-- Bottom: Step detail -->
  <rect x="60" y="420" width="840" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#ds)"/>
  <text x="80" y="448" font-size="14" font-weight="700" fill="#b45309">Step 原子变更（Transform 内部）</text>
  <text x="80" y="470" font-size="11" fill="#92400e">ReplaceStep · ReplaceAroundStep · AttrStep · DocAttrStep · AddMarkStep · RemoveMarkStep · AddNodeMarkStep · RemoveNodeMarkStep</text>
  <text x="80" y="488" font-size="11" fill="#92400e">每个 Step 支持 apply(doc) → StepResult、invert(doc) → Step、map(mapping) → Step、toJSON() / fromJSON()，是 undo/redo 与协同编辑的基石</text>

  <!-- arrow from transaction down to steps -->
  <path d="M 460 170 L 460 415" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arr)"/>
  <text x="470" y="300" font-size="10" fill="#b45309">内部包含</text>
</svg>
