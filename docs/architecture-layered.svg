<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradState" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradTransform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradModel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">ProseMirror 核心架构分层图</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#64748b">prosemirror-view → prosemirror-state → prosemirror-transform → prosemirror-model</text>

  <!-- View Layer -->
  <rect x="80" y="90" width="740" height="110" rx="12" fill="url(#gradView)" filter="url(#shadow)"/>
  <text x="110" y="122" font-size="18" font-weight="700" fill="#ffffff">prosemirror-view</text>
  <text x="110" y="142" font-size="12" fill="#e0e7ff">DOM 渲染 · 事件处理 · 差异化更新</text>
  <rect x="110" y="152" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="200" y="175" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">EditorView</text>
  <rect x="310" y="152" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="400" y="175" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Decoration</text>
  <rect x="510" y="152" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="600" y="175" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">NodeView / DOMSerializer</text>

  <!-- Arrow View -> State -->
  <line x1="450" y1="200" x2="450" y2="238" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="464" y="224" font-size="11" fill="#64748b">依赖</text>

  <!-- State Layer -->
  <rect x="80" y="245" width="740" height="110" rx="12" fill="url(#gradState)" filter="url(#shadow)"/>
  <text x="110" y="277" font-size="18" font-weight="700" fill="#ffffff">prosemirror-state</text>
  <text x="110" y="297" font-size="12" fill="#e0f2fe">不可变状态 · 事务扩展 · 选区 / 插件</text>
  <rect x="110" y="307" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="200" y="330" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">EditorState</text>
  <rect x="310" y="307" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Transaction</text>
  <rect x="510" y="307" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Selection / Plugin</text>

  <!-- Arrow State -> Transform -->
  <line x1="450" y1="355" x2="450" y2="393" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="464" y="379" font-size="11" fill="#64748b">依赖</text>

  <!-- Transform Layer -->
  <rect x="80" y="400" width="740" height="110" rx="12" fill="url(#gradTransform)" filter="url(#shadow)"/>
  <text x="110" y="432" font-size="18" font-weight="700" fill="#ffffff">prosemirror-transform</text>
  <text x="110" y="452" font-size="12" fill="#d1fae5">文档转换 · 原子变更 · 位置映射 / 逆操作</text>
  <rect x="110" y="462" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="200" y="485" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Transform</text>
  <rect x="310" y="462" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="400" y="485" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Step / StepResult</text>
  <rect x="510" y="462" width="180" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="600" y="485" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">StepMap / Mapping</text>

  <!-- Arrow Transform -> Model -->
  <line x1="450" y1="510" x2="450" y2="548" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="464" y="534" font-size="11" fill="#64748b">依赖</text>

  <!-- Model Layer -->
  <rect x="80" y="555" width="740" height="110" rx="12" fill="url(#gradModel)" filter="url(#shadow)"/>
  <text x="110" y="587" font-size="18" font-weight="700" fill="#ffffff">prosemirror-model</text>
  <text x="110" y="607" font-size="12" fill="#fef3c7">文档模型 · Schema 约束 · 节点 / Mark 持久化结构</text>
  <rect x="80" y="610" width="135" height="36" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="147" y="633" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">Schema</text>
  <rect x="225" y="610" width="135" height="36" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="292" y="633" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">Node / TextNode</text>
  <rect x="370" y="610" width="135" height="36" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="437" y="633" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">Mark / MarkType</text>
  <rect x="515" y="610" width="135" height="36" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="582" y="633" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">Fragment</text>
  <rect x="660" y="610" width="135" height="36" rx="6" fill="rgba(255,255,255,0.22)"/>
  <text x="727" y="633" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">ResolvedPos</text>
</svg>
